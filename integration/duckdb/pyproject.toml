[project]
name = "bigquery-adbc-duckdb-integration"
version = "0.0.0"
requires-python = ">=3.15,<3.16"
# `INSTALL adbc FROM community` takes the current extension build for this DuckDB
# release, so the suite follows new builds; each run logs the one it used.
dependencies = [
    "duckdb==2.0.0",
    "pytest==9.2.0",
    # DuckDB's Python layer needs pytz to fetch a TIMESTAMP WITH TIME ZONE.
    "pytz==2026.6",
]

[tool.uv]
package = false
