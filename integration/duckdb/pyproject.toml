[project]
name = "bigquery-adbc-duckdb-integration"
version = "0.0.0"
requires-python = ">=3.15,<3.16"
# The `adbc` community extension is published per DuckDB version, so the pinned
# DuckDB release also pins the extension build that the suite exercises.
dependencies = [
    "duckdb==2.0.0",
    "pytest==9.2.0",
    # DuckDB's Python layer needs pytz to fetch a TIMESTAMP WITH TIME ZONE.
    "pytz==2026.6",
]

[tool.uv]
package = false
