[pytest]
testpaths = tests
addopts = -ra
xfail_strict = true
strict_config = true
strict_markers = true
junit_suite_name = bigquery-adbc-foundry-validation
junit_duration_report = call
markers =
    feature: test for a driver-specific feature
    requires_features: feature names required by a test
filterwarnings =
    error
    ignore:record_property is incompatible with junit_family:pytest.PytestWarning
