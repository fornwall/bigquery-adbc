name: Feature request
description: Suggest a new capability or a change in behavior.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Please check the [known limitations](https://github.com/fornwall/bigquery-adbc/blob/main/docs/LIMITATIONS.md) first.
        Legacy SQL and load jobs for ADBC bulk ingestion are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, rather than a particular solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What the driver should do. Mention the ADBC or BigQuery API it relates to, if you know it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today, or how another driver handles this.
