name: Portable Python wheels

# Cargo resolves every declared target's path, so benches/ and tools/ are inputs too; LICENSE
# and NOTICE and python/licenses/ ship in the wheel.
on:
  pull_request:
    paths: &wheel-inputs
      - ".github/workflows/wheels.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "NOTICE"
      - "benches/**"
      - "python/**"
      - "rust-toolchain.toml"
      - "src/**"
      - "tools/**"
  push:
    # Pull requests already cover branch pushes. GitHub ignores path filters for tag pushes.
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths: *wheel-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - windows-2025
          - macos-26-intel
          - macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml names the toolchain. Linux builds run inside manylinux containers
      # and install it through cibuildwheel's before-all command in python/pyproject.toml.
      - name: Install the pinned Rust toolchain on the host
        if: runner.os != 'Linux'
        run: rustup toolchain install

      - name: Build, repair, and test the wheel
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          extras: uv
          package-dir: ./python
          output-dir: wheelhouse

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bigquery-adbc-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # Test the tagged commit itself and upload its tested sdist for publishing.
  ci:
    name: CI
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  # PyPI trusts this workflow and environment through Trusted Publishing, so no token is stored.
  # PyPI versions are immutable: publish only after CI and every platform build have passed.
  publish:
    name: Publish to PyPI
    if: github.ref_type == 'tag'
    needs: [build-wheels, ci]
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/bigquery-adbc/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bigquery-adbc-*
          merge-multiple: true
          path: dist

      # skip-existing lets a re-run finish an upload that stopped partway.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
