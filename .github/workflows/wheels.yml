name: Wheels and releases

# Cargo resolves every declared target's path, so benches/ and tools/ are inputs too; LICENSE
# and NOTICE and python/licenses/ ship in the wheel.
on:
  pull_request:
    paths: &wheel-inputs
      - ".github/workflows/wheels.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "NOTICE"
      - "benches/**"
      - "python/**"
      - "rust-toolchain.toml"
      - "src/**"
      - "tools/**"
  push:
    # Pull requests already cover branch pushes. GitHub ignores path filters for tag pushes.
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths: *wheel-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - windows-2025
          - macos-26-intel
          - macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml names the toolchain. Linux builds run inside manylinux containers
      # and install it through cibuildwheel's before-all command in python/pyproject.toml.
      - name: Install the pinned Rust toolchain on the host
        if: runner.os != 'Linux'
        run: rustup toolchain install

      - name: Build, repair, and test the wheel
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          extras: uv
          package-dir: ./python
          output-dir: wheelhouse

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bigquery-adbc-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      # Take the library from the wheel so the archive ships the binary cibuildwheel just tested,
      # with the wheel's portability: a build on this runner would need the runner's newer glibc.
      - name: Package the native library
        shell: bash
        run: >-
          uv run --no-project --python 3.14 --with "setuptools>=84.2.1"
          python tools/package_native.py --wheel wheelhouse/*.whl --output-dir native
          --compressed-library

      # Not named bigquery-adbc-*: the publish job uploads all of those to PyPI.
      - name: Upload native archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}
          path: native/*
          if-no-files-found: error

  # Test the tagged commit itself and upload its tested sdist for publishing.
  ci:
    name: CI
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  # Runs before PyPI because a release can be corrected and a PyPI version cannot.
  github-release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs: [build-wheels, ci]
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: dist

      # `dbt-bigquery-adbc system update` runs the latest release's copy.
      - name: Add the dbt installer
        run: cp tools/dbt-build/install.sh dist/

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Take the release notes from the changelog
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^(## \[|\[[^]]+\]: )/ { exit }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entries for ${GITHUB_REF_NAME#v}" >&2
            exit 1
          fi

      # Re-running finishes a release that stopped partway.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi

  # After the release, because a release build hashes the driver it published. A push to main uses
  # the library built above. Nothing depends on these jobs, so they never hold up PyPI.
  build-dbt:
    name: dbt on ${{ matrix.os }}
    if: ${{ !cancelled() && !failure() && github.event_name != 'pull_request' }}
    needs: [build-wheels, github-release]
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container }}
    timeout-minutes: 180
    # A newer push replaces an older one's dbt, but a release must always finish.
    concurrency:
      group: dbt-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.ref_type != 'tag' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # dbt needs manylinux_2_28, as the wheels do: a runner's newer glibc would not be portable.
          - os: ubuntu-26.04
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
            protoc: linux-x86_64
            protoc-sha256: 3074ee900792fa7bf06ab56bd14af83048016cac08abf2a2ae34aaa571a9c110
          - os: ubuntu-26.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21
            protoc: linux-aarch_64
            protoc-sha256: c219a9213a8fa26bc9f644e36e7d756a5b8a7c8a629b60f9d0d1248e59d2fa31
          - os: macos-26-intel
            container: ""
            protoc: osx-universal_binary
            protoc-sha256: 56a8139d6f93d173328a1c4ac96778d1fb7c4f805665d001f5643be095ba8397
          - os: macos-26
            container: ""
            protoc: osx-universal_binary
            protoc-sha256: 56a8139d6f93d173328a1c4ac96778d1fb7c4f805665d001f5643be095ba8397
          - os: windows-2025
            container: ""
            protoc: win64
            protoc-sha256: ff81e031a53969c3990d693978c45e9ef710e49a07056f8082faa8706f1a0594

    steps:
      # All history and tags: the driver version comes from git describe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The container's user does not own the checkout, which git otherwise refuses to read.
      - name: Prepare the container
        if: matrix.container != ''
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install protoc
        if: runner.os != 'Windows'
        env:
          PROTOC: ${{ matrix.protoc }}
          PROTOC_SHA256: ${{ matrix.protoc-sha256 }}
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.4/protoc-29.4-$PROTOC.zip"
          if command -v sha256sum > /dev/null; then
            echo "$PROTOC_SHA256  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          else
            echo "$PROTOC_SHA256  $RUNNER_TEMP/protoc.zip" | shasum -a 256 -c -
          fi
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      # Git Bash has no unzip.
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PROTOC: ${{ matrix.protoc }}
          PROTOC_SHA256: ${{ matrix.protoc-sha256 }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP protoc.zip
          $dir = Join-Path $env:RUNNER_TEMP protoc
          Invoke-WebRequest -OutFile $zip `
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.4/protoc-29.4-$env:PROTOC.zip"
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne $env:PROTOC_SHA256) {
            throw "protoc.zip does not match its SHA-256"
          }
          Expand-Archive -Path $zip -DestinationPath $dir
          Join-Path $dir bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.os }}
          path: native

      # The native archive is a .tar.gz, or a .zip on Windows.
      - name: Build dbt
        run: bash tools/dbt-build/build.sh --driver-archive native/bigquery-adbc-* --output-dir dbt

      # Not named bigquery-adbc-* or native-*: the jobs above publish all of those.
      - name: Upload dbt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbt-${{ matrix.os }}
          path: dbt/*
          if-no-files-found: error

  # Attaches whichever platforms built, so one failure does not hold back the others; re-running the
  # failed build re-runs this too.
  attach-dbt:
    name: Attach dbt to the GitHub release
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.build-dbt.result != 'skipped' }}
    needs: build-dbt
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dbt-*
          merge-multiple: true
          path: dist

      # Re-running finishes an attachment that stopped partway.
      - name: Attach the archives
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -- * > dbt-SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" ./* --clobber --repo "$GITHUB_REPOSITORY"

  # PyPI trusts this workflow and environment through Trusted Publishing, so no token is stored.
  # PyPI versions are immutable: publish only after CI and every platform build have passed.
  publish:
    name: Publish to PyPI
    if: github.ref_type == 'tag'
    needs: [build-wheels, ci, github-release]
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/bigquery-adbc/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bigquery-adbc-*
          merge-multiple: true
          path: dist

      # skip-existing lets a re-run finish an upload that stopped partway.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
