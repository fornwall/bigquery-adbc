name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Only PR runs share a group; reusable CI must not share its caller's group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the channel and the rustfmt/clippy components.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features

      - name: Clippy (default features, as the driver ships)
        run: cargo clippy --locked --all-targets

      # The separate fuzz workspace needs its own check; linking libFuzzer is unnecessary.
      - name: Fuzz targets compile
        if: runner.os == 'Linux'
        run: cargo check --locked --manifest-path fuzz/Cargo.toml

      # Live BigQuery tests are ignored by default.
      - name: Test
        run: cargo test --locked --all-features --no-fail-fast

      - name: Verify dependency license bundle
        if: runner.os == 'Linux'
        run: python3 tools/generate_licenses.py --check

      - name: Documentation
        if: runner.os == 'Linux'
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # Compile and enumerate the pinned C++ suite without BigQuery credentials.
      - name: ADBC validation drift
        if: runner.os == 'Linux'
        env:
          BIGQUERY_ADBC_INTEGRATION_TEST_GCP_PROJECT: offline-validation-project
          BIGQUERY_ADBC_TEST_TARGET: clients
        run: scripts/run-one-live-test.sh suite_matches_coverage_baseline

  # Exercise stdlib compatibility on the oldest and newest supported Python versions.
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      # The DuckDB suites pin `3.15+gil`, a request uv can satisfy but will not download.
      - name: Install the Python version the DuckDB suites pin
        run: uv python install 3.15

      - name: Python, shell, and workflow lint
        if: matrix.python-version == '3.15'
        run: |
          scripts/run-python-lint.sh
          shellcheck -x --severity=style scripts/*.sh scripts/lib/*.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: Offline Python tests
        env:
          BIGQUERY_ADBC_WHEEL_PYTHON: ${{ matrix.python-version }}
        run: scripts/run-offline-python-tests.sh

  # Build from the sdist, then test the installed wheel with the released driver manager.
  # This catches missing source files and undeclared runtime dependencies.
  python-package:
    name: Python sdist and wheel
    runs-on: ubuntu-26.04
    env:
      # Share the Cargo cache with builds from extracted source distributions.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # uv builds the wheel from the sdist by default.
      - name: Build the source distribution and wheel
        run: uv build --out-dir dist python

      # Use only declared dependencies and pytest, as a fresh installation would.
      - name: Test the installed wheel with the released adbc-driver-manager
        run: |
          . scripts/lib/built-wheel.sh
          wheel=$(built_wheel dist)
          uv venv .venv-wheel-test
          uv pip install --python .venv-wheel-test/bin/python \
            "${wheel}[dbapi]" pytest
          uv pip check --python .venv-wheel-test/bin/python
          .venv-wheel-test/bin/python -m pytest -q -p no:cacheprovider \
            python/tests/test_installed_wheel.py

      # Also reject non-release tags selected through workflow_dispatch.
      - name: Check the release tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "dist/bigquery_adbc-${GITHUB_REF_NAME#v}.tar.gz"

      - name: Upload the tested source distribution
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bigquery-adbc-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
