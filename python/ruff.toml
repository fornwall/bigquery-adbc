# Shared lint configuration, discovered automatically within python/.
# scripts/run-python-lint.sh passes it explicitly for integration/ as well.

target-version = "py311"  # matches `requires-python` in python/pyproject.toml

# Long enough for the generated `_options.py`, whose longest constant lines exceed 100.
line-length = 120

extend-exclude = [
    # Build outputs and vendored environments, not sources.
    "**/.venv",
    "**/integration/dbt/logs",
    "**/integration/dbt/target",
    "**/integration/dbt/.cache",
    "**/target",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade: no syntax older than target-version
    "B",    # bugbear: likely bugs, not style
    "BLE",  # blind `except Exception`, which must be justified with a noqa reason
    "C4",   # comprehension rewrites
    "SIM",  # simplifiable constructs
    "RET",  # return-statement simplifications
    "PIE",  # miscellaneous lints
    "PGH",  # require specific suppression codes
    "PLE",  # pylint errors
    "PLW1510", # require explicit subprocess failure handling
    "PT012", # keep exception assertions focused on one operation
    "PTH",  # prefer pathlib over os.path
    "FA",   # `from __future__ import annotations` where the file needs it
    "TID",  # tidy imports: no relative imports beyond the current package
    "DTZ",  # timezone-naive datetime calls
    "LOG",  # logging misuse
    "G",    # logging format-string misuse
    "INT",  # gettext misuse
    "YTT",  # sys.version misuse
    "EXE",  # shebang/executable-bit mismatches
    "SLOT", # __slots__ on subclasses of immutables
    "T10",  # debugger statements
    "FURB", # modernizations
    "RUF",  # ruff's own rules, including stale-noqa detection
]

# Rule groups excluded from this configuration:
#   ANN   - the harness scripts are not fully annotated; Pyrefly checks types.
#   D     - no docstring convention is in force in this repository.
#   TRY   - exception messages are kept at their raise sites.
#   T20   - integration harnesses print CLI output.
#   ICN   - would force conventional aliases such as `import pyarrow as pa` everywhere.
#   PERF  - PERF203 flags try/except inside loops, which the retry helpers need.
#   COM/Q/ISC - these overlap or conflict with the Ruff formatter.
#   A     - `python/src/bigquery_adbc/dbapi.py` shadows a builtin by DB-API design.

[lint.per-file-ignores]
# Tests may use `assert False` to mark unreachable paths.
"**/tests/**" = ["B011"]

[lint.isort]
# Keep import grouping identical with auto-discovery in python/ and --config
# from the repository root, where Ruff infers different source directories.
known-first-party = ["_build_support", "_licenses", "_native_wheel", "bigquery_adbc", "build_backend"]

[format]
# Generated by Rust; cargo test --all-features checks the canonical rendering.
exclude = ["_options.py"]
